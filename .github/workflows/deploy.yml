name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *" # every 6 hours: refresh the Google Play figures
  workflow_dispatch:

permissions:
  contents: write # commit refreshed figures
  pages: write
  id-token: write
  actions: write # re-enable this workflow so the schedule never lapses

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Refresh Google Play figures
        # Never block a deploy: on any failure the site keeps its last good figures.
        continue-on-error: true
        run: python3 .github/scripts/update_play_stats.py

      - name: Commit refreshed figures
        run: |
          if git diff --quiet; then
            echo "Figures unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/data/play-stats.json
          git commit -m "Refresh Google Play figures"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Keep the schedule alive
        # GitHub pauses scheduled workflows in public repos after 60 days without activity.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable" || true

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
